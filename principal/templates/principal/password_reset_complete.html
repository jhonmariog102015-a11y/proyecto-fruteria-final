{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contraseña Cambiada | Al Paso Frutería</title>
    <!-- Tipografías oficiales del proyecto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Estilos de autenticación -->
    <link rel="stylesheet" href="{% static 'css/login.css' %}?v=1.1">
</head>
<body class="login-body">
    <div class="login-wrapper">
        <main class="login-card">
            <a href="{% url 'index' %}" class="login-brand" aria-label="Volver a la tienda">
                <img src="{% static 'assets/logo_Transparente.png' %}" alt="Al Paso Frutería">
            </a>

            <div style="width: 60px; height: 60px; border-radius: 50%; background: #e8f5e9; color: var(--verde-primario); display: flex; align-items: center; justify-content: center; margin: 0 auto 1.25rem; font-size: 1.8rem;">
                <i class="bi bi-shield-check"></i>
            </div>

            <h1 class="login-title" style="color: var(--verde-primario);">¡Contraseña Actualizada!</h1>
            <p class="login-subtitle">
                Tu contraseña se ha restablecido exitosamente. Ya puedes iniciar sesión con tus nuevas credenciales.
            </p>

            <a href="{% url 'login' %}" class="btn-submit">
                Iniciar Sesión
            </a>

            <div class="login-footer-links">
                <a class="login-back-link" href="{% url 'index' %}">← Volver a la Tienda</a>
            </div>
        </main>
    </div>
</body>
</html>
