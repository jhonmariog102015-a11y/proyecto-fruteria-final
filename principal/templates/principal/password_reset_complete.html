{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contraseña Cambiada | Al Paso Frutería</title>
    <link rel="stylesheet" href="{% static 'login.css' %}">
</head>
<body class="login-body">
    <div class="login-wrapper">
        <main class="login-card">
            <a href="{% url 'index' %}" class="login-brand" style="margin-bottom: 1.25rem;">
                <img src="{% static 'assets/logo_Transparente.png' %}" alt="El Paso Frutería">
            </a>
            <h1 class="login-title" style="color: #15803d;">¡Contraseña Actualizada!</h1>
            <p class="login-subtitle" style="text-align: center; margin-bottom: 1.5rem;">
                Tu contraseña se ha restablecido exitosamente. Ya puedes iniciar sesión con tus nuevas credenciales.
            </p>
            <a href="{% url 'login' %}" class="btn-submit" style="display: flex; align-items: center; justify-content: center; text-decoration: none;">Iniciar Sesión</a>
        </main>
    </div>
</body>
</html>
