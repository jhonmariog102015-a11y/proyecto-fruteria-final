<!DOCTYPE html>
<html lang="es">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Correo Enviado | Al Paso Frutería</title>
    <link rel="stylesheet" href="{% static 'login.css' %}">
</head>
<body class="login-body">
    <div class="login-wrapper">
        <main class="login-card">
            <a href="{% url 'index' %}" class="login-brand" style="margin-bottom: 1.25rem;">
                <img src="{% static 'assets/logo_Transparente.png' %}" alt="El Paso Frutería">
            </a>
            <h1 class="login-title">Correo Enviado</h1>
            <p class="login-subtitle" style="text-align: center; margin-bottom: 1.5rem;">
                Hemos enviado las instrucciones para restablecer tu contraseña a tu correo electrónico. Si no aparece en unos minutos, revisa tu bandeja de spam.
            </p>
            <a href="{% url 'login' %}" class="btn-submit" style="display: flex; align-items: center; justify-content: center; text-decoration: none;">Volver al Login</a>
        </main>
    </div>
</body>
</html>
