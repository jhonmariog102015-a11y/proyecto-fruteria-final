{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — El Paso Frutería</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #FAFAF7;
            --green-deep: #1A3A26;
            --green-mid: #2E7D32;
            --green-dark: #1b5e20;
            --text-primary: #1E293B;
            --text-secondary: #64748B;
            --border-color: #E2E8F0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .login-wrapper {
            width: 100%;
            max-width: 440px;
        }

        .login-card {
            background: #FFFFFF;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2.5rem 2.2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0, 0, 0, 0.02);
            text-align: center;
        }

        .login-brand {
            display: inline-block;
            margin-bottom: 1.5rem;
        }

        .login-brand img {
            max-height: 70px;
            width: auto;
            object-fit: contain;
        }

        .login-title {
            font-family: 'Syne', sans-serif;
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--green-deep);
            margin-bottom: 0.4rem;
        }

        .login-subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .login-error {
            background-color: #FEF2F2;
            color: #DC2626;
            border: 1px solid #FECACA;
            border-radius: 10px;
            padding: 0.75rem 1rem;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-group {
            text-align: left;
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.4rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            font-size: 0.95rem;
            color: var(--text-primary);
            background: #FFFFFF;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-group input:focus {
            border-color: var(--green-mid);
            box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.12);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--green-mid);
            color: #FFFFFF;
            border: none;
            border-radius: 10px;
            padding: 0.85rem 1.2rem;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(46, 125, 50, 0.25);
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            background-color: var(--green-dark);
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(46, 125, 50, 0.35);
        }

        .login-footer-links {
            margin-top: 1.8rem;
            text-align: center;
        }

        .login-back-link {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--green-mid);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .login-back-link:hover {
            color: var(--green-dark);
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <main class="login-card">
            <a href="{% url 'index' %}" class="login-brand" aria-label="Ir a la tienda">
                <img src="{% static 'assets/logo_Transparente.png' %}" alt="El Paso Frutería">
            </a>

            <h1 class="login-title">Iniciar Sesión</h1>
            <p class="login-subtitle">Acceso administrativo y gestión de catálogo</p>

            {% if form.errors %}
                <div class="login-error" role="alert">
                    Usuario o contraseña incorrectos. Por favor, verifica tus datos.
                </div>
            {% endif %}

            <form method="post" action="">
                {% csrf_token %}
                <div class="form-group">
                    <label for="id_username">Usuario</label>
                    <input type="text" name="username" id="id_username" placeholder="Ingresa tu usuario" required autofocus autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="id_password">Contraseña</label>
                    <input type="password" name="password" id="id_password" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn-submit">Entrar al Panel</button>
            </form>

            <div class="login-footer-links">
                <a class="login-back-link" href="{% url 'index' %}">← Volver a la Tienda</a>
            </div>
        </main>
    </div>
</body>
</html>
