{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Al Paso Frutería</title>
    
    <!-- Tipografías oficiales del proyecto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    
    <!-- Estilos exclusivos del login -->
    <link rel="stylesheet" href="{% static 'login.css' %}">
</head>
<body class="login-body">
    <div class="login-wrapper">
        <main class="login-card">
            <!-- Logotipo de la frutería con enlace a la tienda -->
            <a href="{% url 'index' %}" class="login-brand" aria-label="Volver a la tienda">
                <img src="{% static 'assets/logo_Transparente.png' %}" alt="El Paso Frutería">
            </a>

            <!-- Encabezado de la tarjeta -->
            <h1 class="login-title">Iniciar Sesión</h1>
            <p class="login-subtitle">Acceso administrativo y gestión de catálogo</p>

            <!-- Alerta de credenciales incorrectas -->
            {% if form.errors %}
            <div class="login-error" role="alert">
                Usuario o contraseña incorrectos. Por favor, verifica tus datos.
            </div>
            {% endif %}

            <!-- Formulario de autenticación -->
            <form method="post" action="">
                {% csrf_token %}
                <div class="form-group">
                    <label for="id_username">Usuario</label>
                    <input type="text" name="username" id="id_username" placeholder="Ingresa tu usuario" required autofocus autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="id_password">Contraseña</label>
                    <input type="password" name="password" id="id_password" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn-submit">Entrar al Panel</button>
            </form>

            <!-- Enlace para registrarse -->
            <div class="login-register">
                <span>¿No tienes cuenta?</span>
                <a href="{% url 'registro' %}" class="login-register-link">Regístrate aquí</a>
            </div>

            <!-- Enlace para regresar a la página principal -->
            <div class="login-footer-links">
                <a class="login-back-link" href="{% url 'index' %}">← Volver a la Tienda</a>
            </div>
        </main>
    </div>
</body>
</html>
