{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña | Al Paso Frutería</title>
    <link rel="stylesheet" href="{% static 'login.css' %}"> <!-- Usamos login.css para mantener el diseño unificado -->
</head>
<body class="login-body">
    <div class="login-wrapper">
        <main class="login-card">
            <a href="{% url 'index' %}" class="login-brand">
                <img src="{% static 'assets/logo_Transparente.png' %}" alt="El Paso Frutería">
            </a>

            <h1 class="login-title">Recuperar Contraseña</h1>
            <p class="login-subtitle">Ingresa tu correo electrónico y te enviaremos instrucciones para restablecer tu contraseña.</p>

            <form method="post" action="">
                {% csrf_token %}
                <div class="form-group" style="text-align: left; margin-bottom: 1.25rem;">
                    <label for="id_email" style="display: block; font-weight: 600; font-size: 0.88rem; color: #1e293b; margin-bottom: 6px;">Correo Electrónico *</label>
                    <input type="email" name="email" id="id_email" placeholder="correo@ejemplo.com" required autofocus autocomplete="email"
                           style="width: 100%; height: 48px; padding: 0.75rem 1rem; border: 1.5px solid #cbd5e1; border-radius: 12px; font-size: 0.95rem;">
                </div>
                {% if form.email.errors %}
                <div class="login-error" role="alert" style="margin-bottom: 15px; font-size: 0.85rem;">
                    {{ form.email.errors|striptags }}
                </div>
                {% endif %}
                <button type="submit" class="btn-submit" style="margin-top: 5px; cursor: pointer;">Enviar enlace de recuperación</button>
            </form>
            <div style="margin-top: 18px; text-align: center;">
                <a href="{% url 'login' %}" style="font-size: 0.88rem; color: #097a57; text-decoration: none; font-weight: 600;">
                    ← Volver a Iniciar Sesión
                </a>
            </div>
        </main>
    </div>
</body>
</html>
